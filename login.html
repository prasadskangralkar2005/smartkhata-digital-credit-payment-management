<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SmartKhata</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>SmartKhata</h1>

            <h2>Welcome Back</h2>

            <p class="auth-subtitle">
                Login to manage your accounts
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="auth-link">

                Don't have an account?

                <a href="/register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>
<script
    type="module"
    src="/src/js/theme.js"
></script>
    <script type="module" src="/src/js/auth.js"></script>

</body>

</html>
