<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>People | SmartKhata</title>

    <link rel="stylesheet" href="/css/people.css">

</head>

<body>

    <!-- Mobile Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ₹
            </div>

            <div>
                <h2>SmartKhata</h2>
                <span>Money Management</span>
            </div>

        </div>


        <nav class="navigation">

            <a href="/dashboard.html" class="nav-item">

                <span>🏠</span>
                <span>Dashboard</span>

            </a>


            <a href="/people.html" class="nav-item active">

                <span>👥</span>
                <span>People</span>

            </a>


            <a href="/transactions.html" class="nav-item">

                <span>💰</span>
                <span>Transactions</span>

            </a>


           <a href="/payments.html" class="nav-item">
    <span>💸</span>
    <span>Payments</span>
</a>


            <a href="reminders.html" class="nav-item">

                <span>🔔</span>
                <span>Reminders</span>

            </a>


            <a href="reports.html" class="nav-item">

                <span>📊</span>
                <span>Reports</span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="#" class="nav-item">

                <span>⚙️</span>
                <span>Settings</span>

            </a>


            <button
                id="logoutButton"
                class="nav-item logout-button"
            >

                <span>🚪</span>
                <span>Logout</span>

            </button>

        </div>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <button
                id="menuButton"
                class="menu-button"
            >
                ☰
            </button>


            <div class="topbar-right">

                <button class="notification-button">
                    🔔
                </button>


                <div class="profile">

                    <div class="avatar">

                        <span id="userInitial">
                            U
                        </span>

                    </div>


                    <div class="profile-info">

                        <strong id="userName">
                            User
                        </strong>

                        <span id="userEmail">
                            Loading...
                        </span>

                    </div>

                </div>

            </div>

        </header>



        <!-- =====================================================
             PAGE
             ===================================================== -->

        <section class="page-container">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>
                        People
                    </h1>

                    <p>
                        Manage customers, suppliers and contacts.
                    </p>

                </div>


                <button
                    id="addPersonButton"
                    class="primary-button"
                >

                    ＋ Add Person

                </button>

            </div>



            <!-- SEARCH -->

            <div class="search-container">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, phone or email..."
                >

            </div>



            <!-- =================================================
                 ADD / EDIT FORM
                 ================================================= -->

            <section
                id="personFormCard"
                class="form-card hidden"
            >

                <div class="form-header">

                    <div>

                        <h2 id="formTitle">
                            Add Person
                        </h2>

                        <p>
                            Enter the person's contact information.
                        </p>

                    </div>

                    <button
                        id="closeFormButton"
                        class="close-button"
                    >
                        ×
                    </button>

                </div>


                <form id="personForm">


                    <div class="form-grid">


                        <!-- NAME -->

                        <div class="form-group">

                            <label for="name">
                                Name *
                            </label>

                            <input
                                type="text"
                                id="name"
                                required
                                maxlength="100"
                                placeholder="e.g. Rahul Sharma"
                            >

                        </div>



                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="phone">
                                Phone
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                maxlength="20"
                                placeholder="e.g. 9876543210"
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                maxlength="150"
                                placeholder="e.g. rahul@gmail.com"
                            >

                        </div>



                        <!-- ADDRESS -->

                        <div class="form-group">

                            <label for="address">
                                Address
                            </label>

                            <input
                                type="text"
                                id="address"
                                maxlength="250"
                                placeholder="Enter address"
                            >

                        </div>



                        <!-- NOTES -->

                        <div class="form-group full-width">

                            <label for="notes">
                                Notes
                            </label>

                            <textarea
                                id="notes"
                                maxlength="500"
                                rows="3"
                                placeholder="Optional notes..."
                            ></textarea>

                        </div>

                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            id="cancelButton"
                            class="secondary-button"
                        >
                            Cancel
                        </button>


                        <button
                            type="submit"
                            id="saveButton"
                            class="primary-button"
                        >
                            Save Person
                        </button>

                    </div>

                </form>

            </section>



            <!-- =================================================
                 PEOPLE LIST
                 ================================================= -->

            <section class="people-card">


                <div class="list-header">

                    <div>

                        <h2>
                            Your People
                        </h2>

                        <span id="peopleCount">
                            0 people
                        </span>

                    </div>

                </div>


                <div
                    id="peopleList"
                    class="people-list"
                >

                    <div class="loading">
                        Loading people...
                    </div>

                </div>


            </section>


        </section>

    </main>

<script type="module" src="/src/js/people.js"></script>

</body>

</html>
